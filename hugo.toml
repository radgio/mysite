baseURL = "https://nginx-pa.duckdns.org/"
locale = "it-it"
title = "Post-it"
theme = "PaperMod"

enableRobotsTXT = true

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
[params.assets]
  favicon = "/favicon.ico"
  favicon16x16 = "/favicon-16x16.png"
  favicon32x32 = "/favicon-32x32.png"
[params.homeInfoParams]
  Title = "Benvenuto"
  Content = "Questo è il mio sito Hugo con PaperMod."
[params.profileMode]
  enabled = true
  title = "Post-it"
  subtitle = "Il mio archivio personale di appunti e ricette"
  imageUrl = "/images/home.jpg"
  imageTitle = "Immagine di profilo"
  imageWidth = 600
  
  [[params.profileMode.buttons]]
    name = "Vai all'Archivio"
    url = "/categories/"
[[params.socialIcons]]
  name = "github"
  url = "https://github.com/"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "categories"
    name = "Categorie"
    url = "/categories/"
    weight = 15
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "manuale"
    name = "Manuale"
    url = "/manuale/"
    weight = 30
